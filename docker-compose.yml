services:
  115transfer:
    build: .
    container_name: 115transfer
    ports:
      - "3698:3698"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3698/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - FLASK_DEBUG=false
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
      # 以下为安全相关配置，请务必修改为强随机值
      - APP_PASSWORD=${APP_PASSWORD:-change_me_please}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change_me_to_random_32_byte_hex}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - WECHAT_PROXY_TOKEN=${WECHAT_PROXY_TOKEN:-}
      - HTTPS_ENABLED=${HTTPS_ENABLED:-false}