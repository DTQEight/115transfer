{% extends "base.html" %}

{% block title %}115Transfer - 电影搜索{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <!-- 配置卡片 -->
        <div class="card mb-4">
            <div class="card-header">
                <i class="bi bi-gear me-2"></i>论坛配置
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">账号</label>
                    <input type="text" id="forumUser" class="form-control" placeholder="论坛账号">
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" id="forumPass" class="form-control" placeholder="论坛密码">
                </div>
                <div class="d-flex gap-2">
                    <button onclick="saveForumConfig()" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>保存配置
                    </button>
                    <button onclick="testForumLogin()" class="btn btn-outline-success">
                        <i class="bi bi-check-circle me-1"></i>测试登录
                    </button>
                </div>
                <div id="configResult" class="mt-3"></div>
            </div>
        </div>

        <!-- 搜索卡片 -->
        <div class="card mb-4">
            <div class="card-header">
                <i class="bi bi-search me-2"></i>搜索电影
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" id="searchKeyword" class="form-control" placeholder="输入电影名称（中文或英文）" onkeydown="if(event.key==='Enter'){searchMovies();}">
                    <button onclick="searchMovies()" class="btn btn-primary">
                        <i class="bi bi-search me-1"></i>搜索
                    </button>
                </div>
                <div id="formatFilter"></div>
                <div id="searchResult"></div>
            </div>
        </div>
    </div>
</div>

<script>
// 页面加载时读取配置
(async function loadForumConfig() {
    try {
        var resp = await fetch('/baidu/config');
        if (!resp.ok) return;
        var result = await resp.json();
        if (result.success && result.config) {
            if (result.config.username) document.getElementById('forumUser').value = result.config.username;
            if (result.config.password) document.getElementById('forumPass').value = result.config.password;
        }
    } catch (e) {
        console.error('加载配置失败:', e);
    }
})();

function showResult(elId, html, type) {
    var el = document.getElementById(elId);
    var cls = type === 'danger' ? 'alert-danger' : (type === 'success' ? 'alert-success' : 'alert-info');
    el.innerHTML = '<div class="alert ' + cls + ' mb-0">' + html + '</div>';
}

async function saveForumConfig() {
    var username = document.getElementById('forumUser').value.trim();
    var password = document.getElementById('forumPass').value.trim();
    if (!username || !password) {
        showResult('configResult', '请输入账号和密码', 'danger');
        return;
    }
    try {
        var resp = await fetch('/baidu/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: username, password: password})
        });
        var result = await resp.json();
        if (result.success) {
            showResult('configResult', '配置已保存', 'success');
        } else {
            showResult('configResult', result.message || '保存失败', 'danger');
        }
    } catch (e) {
        showResult('configResult', '保存失败: ' + e.message, 'danger');
    }
}

async function testForumLogin() {
    showResult('configResult', '<i class="bi bi-arrow-repeat me-1"></i>测试中...', 'info');
    try {
        var resp = await fetch('/baidu/test');
        var result = await resp.json();
        if (result.success) {
            showResult('configResult', result.message, 'success');
        } else {
            showResult('configResult', result.message, 'danger');
        }
    } catch (e) {
        showResult('configResult', '测试失败: ' + e.message, 'danger');
    }
}

var searchKeyword = '';
var currentResults = [];
var activeFormat = '';

function detectFormat(title) {
    var t = title.toUpperCase();
    // 杜比视界 (Dolby Vision) 优先
    if (/DOLBY[\s.]?VISION|DV[\s.]|DoVi/i.test(t)) return '杜比视界';
    // 4K蓝光原盘
    if (/\b(4K|2160P)\b/.test(t) && /\b(BLU[\s-]?RAY|REMUX)\b.*\b(原盘|DISC|ISO)\b|\b(原盘|DISC|ISO)\b.*\b(BLU[\s-]?RAY|REMUX)\b/i.test(t)) return '4K蓝光原盘';
    // 3D
    if (/\b3D\b/i.test(t)) return '3D';
    // 蓝光原盘
    if (/\b(原盘|DISC|ISO)\b/i.test(t) && /\b(BLU[\s-]?RAY|BDREMUX)\b/i.test(t)) return '蓝光原盘';
    // 4K蓝光
    if (/\b(4K|2160P)\b/.test(t) && /\b(BLU[\s-]?RAY|BDREMUX|REMUX)\b/i.test(t)) return '4K蓝光';
    // 1080P Remux
    if (/\b1080P?\b/.test(t) && /\bREMUX\b/i.test(t)) return '1080P-Remux';
    // 1080P蓝光
    if (/\b1080P?\b/.test(t) && /\b(BLU[\s-]?RAY|BDRIP|BDREMUX)\b/i.test(t)) return '1080P蓝光';
    // WEB-4K
    if (/\b(4K|2160P)\b/.test(t) && /\b(WEB[\s-]?(DL|RIP)|WEBDL)\b/i.test(t)) return 'WEB-4K';
    // WEB-1080P
    if (/\b1080P?\b/.test(t) && /\b(WEB[\s-]?(DL|RIP)|WEBDL)\b/i.test(t)) return 'WEB-1080P';
    // 4K其他
    if (/\b(4K|2160P)\b/.test(t)) return '4K蓝光';
    // 1080P其他
    if (/\b1080P?\b/.test(t)) return '1080P蓝光';
    return '其他';
}

function getFormatBadgeColor(fmt) {
    var colors = {
        '4K蓝光': 'danger',
        '4K蓝光原盘': 'danger',
        '杜比视界': 'warning text-dark',
        '1080P蓝光': 'primary',
        '1080P-Remux': 'info text-dark',
        'WEB-4K': 'success',
        'WEB-1080P': 'success',
        '蓝光原盘': 'secondary',
        '3D': 'dark',
        '其他': 'light text-dark'
    };
    return colors[fmt] || 'light text-dark';
}

function renderFormatFilter() {
    var counts = {};
    var order = ['4K蓝光', '4K蓝光原盘', '1080P蓝光', '1080P-Remux', 'WEB-4K', 'WEB-1080P', '杜比视界', '蓝光原盘', '3D', '其他'];
    currentResults.forEach(function(r) {
        var fmt = r._format || '其他';
        counts[fmt] = (counts[fmt] || 0) + 1;
    });
    var html = '<div class="d-flex flex-wrap gap-1 mb-3">';
    html += '<button class="btn btn-sm ' + (!activeFormat ? 'btn-dark' : 'btn-outline-dark') + '" onclick="filterByFormat(\'\')">全部 (' + currentResults.length + ')</button>';
    order.forEach(function(fmt) {
        if (counts[fmt]) {
            var cls = activeFormat === fmt ? 'btn-' + getFormatBadgeColor(fmt) : 'btn-outline-' + getFormatBadgeColor(fmt);
            html += '<button class="btn btn-sm ' + cls + '" onclick="filterByFormat(\'' + fmt + '\')">' + fmt + ' (' + counts[fmt] + ')</button>';
        }
    });
    html += '</div>';
    document.getElementById('formatFilter').innerHTML = html;
}

function filterByFormat(fmt) {
    activeFormat = fmt;
    renderFormatFilter();
    var items = document.querySelectorAll('.search-item');
    items.forEach(function(el) {
        if (!fmt || el.dataset.format === fmt) {
            el.style.display = '';
        } else {
            el.style.display = 'none';
        }
    });
}

async function searchMovies(page) {
    var keyword = document.getElementById('searchKeyword').value.trim();
    if (!keyword && !page) {
        showToast('请输入搜索关键词', 'danger');
        return;
    }
    if (keyword) searchKeyword = keyword;
    page = page || 1;
    var el = document.getElementById('searchResult');
    el.innerHTML = '<p class="text-muted text-center"><i class="bi bi-arrow-repeat me-1"></i>搜索中...</p>';
    try {
        var resp = await fetch('/baidu/search', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'keyword=' + encodeURIComponent(searchKeyword) + '&page=' + page
        });
        var result = await resp.json();
        if (!result.success) {
            el.innerHTML = '<div class="alert alert-danger">' + (result.message || '搜索失败') + '</div>';
            return;
        }
        if (!result.results || result.results.length === 0) {
            el.innerHTML = '<div class="alert alert-info">未找到结果</div>';
            return;
        }
        var totalCount = result.total_count || result.results.length;
        currentResults = result.results;
        currentResults.forEach(function(r) { r._format = detectFormat(r.title); });
        activeFormat = '';
        renderFormatFilter();
        var html = '<p class="text-muted mb-2">共 ' + totalCount + ' 个结果，当前第 ' + result.page + '/' + result.total_pages + ' 页（每页约30条）</p>';
        html += '<div class="list-group">';
        result.results.forEach(function(r, i) {
            var title = escapeHtml(r.title);
            var fmt = r._format || '其他';
            var badgeColor = getFormatBadgeColor(fmt);
            var meta = (r.forum || '') + ' · ' + (r.replies || '0') + '回复 · ' + (r.views || '0') + '查看';
            if (r.date) meta += ' · ' + r.date;
            if (r.author) meta += ' · ' + escapeHtml(r.author);
            html += '<div class="list-group-item list-group-item-action search-item" data-format="' + fmt + '">' +
                '<div class="d-flex justify-content-between align-items-start">' +
                    '<div class="me-2 flex-grow-1">' +
                        '<h6 class="mb-1"><span class="badge bg-' + badgeColor + ' me-1">' + fmt + '</span>' + title + '</h6>' +
                        '<small class="text-muted">' + escapeHtml(meta) + '</small>' +
                    '</div>' +
                    '<div class="d-flex gap-1 flex-shrink-0">' +
                        '<button class="btn btn-sm btn-outline-primary" onclick="getMagnet(' + r.tid + ', this)" title="获取磁力链接">' +
                            '<i class="bi bi-magnet"></i>' +
                        '</button>' +
                        '<button class="btn btn-sm btn-outline-success" onclick="saveTo115(' + r.tid + ', this)" title="添加到115离线下载">' +
                            '<i class="bi bi-cloud-plus"></i>' +
                        '</button>' +
                    '</div>' +
                '</div>' +
                '<div class="mt-2" id="magnet-' + r.tid + '"></div>' +
            '</div>';
        });
        html += '</div>';
        // 分页
        if (result.total_pages > 1) {
            html += '<nav class="mt-3"><ul class="pagination pagination-sm justify-content-center mb-0">';
            if (result.page > 1) {
                html += '<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="searchMovies(' + (result.page - 1) + ')"><i class="bi bi-chevron-left"></i></a></li>';
            }
            var start = Math.max(1, result.page - 3);
            var end = Math.min(result.total_pages, result.page + 3);
            if (start > 1) {
                html += '<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="searchMovies(1)">1</a></li>';
                if (start > 2) html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
            }
            for (var p = start; p <= end; p++) {
                html += '<li class="page-item ' + (p === result.page ? 'active' : '') + '"><a class="page-link" href="javascript:void(0)" onclick="searchMovies(' + p + ')">' + p + '</a></li>';
            }
            if (end < result.total_pages) {
                if (end < result.total_pages - 1) html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
                html += '<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="searchMovies(' + result.total_pages + ')">' + result.total_pages + '</a></li>';
            }
            if (result.page < result.total_pages) {
                html += '<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="searchMovies(' + (result.page + 1) + ')"><i class="bi bi-chevron-right"></i></a></li>';
            }
            html += '</ul></nav>';
        }
        el.innerHTML = html;
    } catch (e) {
        el.innerHTML = '<div class="alert alert-danger">搜索失败: ' + escapeHtml(e.message) + '</div>';
    }
}

async function getMagnet(tid, btn) {
    var el = document.getElementById('magnet-' + tid);
    el.innerHTML = '<small class="text-muted"><i class="bi bi-arrow-repeat me-1"></i>获取磁力链接中...</small>';
    btn.disabled = true;
    try {
        var resp = await fetch('/baidu/magnet', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'tid=' + tid
        });
        var result = await resp.json();
        if (!result.success) {
            el.innerHTML = '<small class="text-danger">' + escapeHtml(result.message || '获取失败') + '</small>';
            return;
        }
        var magnet = result.magnet;
        var name = result.name || '';
        el.innerHTML =
            '<div class="input-group input-group-sm">' +
                '<input type="text" class="form-control" value="' + escapeHtml(magnet) + '" readonly onclick="this.select()">' +
                '<button class="btn btn-outline-secondary" onclick="copyText(\'' + magnet.replace(/'/g, "\\'") + '\')">复制</button>' +
                '<button class="btn btn-outline-success" onclick="addMagnetTo115(\'' + magnet.replace(/'/g, "\\'") + '\', ' + tid + ')">添加到115</button>' +
            '</div>' +
            (name ? '<small class="text-muted mt-1 d-block">' + escapeHtml(name) + '</small>' : '');
    } catch (e) {
        el.innerHTML = '<small class="text-danger">获取失败: ' + escapeHtml(e.message) + '</small>';
    } finally {
        btn.disabled = false;
    }
}

async function saveTo115(tid, btn) {
    btn.disabled = true;
    var original = btn.innerHTML;
    btn.innerHTML = '<i class="bi bi-arrow-repeat"></i>';
    try {
        var resp = await fetch('/baidu/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'tid=' + tid
        });
        var result = await resp.json();
        if (result.success) {
            showToast(result.message, 'success');
        } else {
            showToast(result.message || '添加失败', 'danger');
        }
    } catch (e) {
        showToast('添加失败: ' + e.message, 'danger');
    } finally {
        btn.disabled = false;
        btn.innerHTML = original;
    }
}

async function addMagnetTo115(magnet, tid) {
    try {
        var resp = await fetch('/baidu/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'magnet=' + encodeURIComponent(magnet)
        });
        var result = await resp.json();
        if (result.success) {
            showToast(result.message, 'success');
        } else {
            showToast(result.message || '添加失败', 'danger');
        }
    } catch (e) {
        showToast('添加失败: ' + e.message, 'danger');
    }
}

function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
            showToast('已复制', 'success');
        }).catch(function() {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
        document.execCommand('copy');
        showToast('已复制', 'success');
    } catch (e) {
        showToast('复制失败，请手动复制', 'danger');
    }
    document.body.removeChild(ta);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
</script>
{% endblock %}
