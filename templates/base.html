<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}电影磁力链接管理{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --card-shadow: 0 2px 12px rgba(0,0,0,0.08);
            --card-hover-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        [data-bs-theme="dark"] {
            --card-shadow: 0 2px 12px rgba(0,0,0,0.3);
            --card-hover-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        body {
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        [data-bs-theme="dark"] body {
            background: #1a1a2e;
        }
        .navbar-custom {
            background: var(--primary-gradient);
            box-shadow: 0 2px 20px rgba(102, 126, 234, 0.4);
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: box-shadow 0.3s ease;
        }
        .card:hover {
            box-shadow: var(--card-hover-shadow);
        }
        .card-header {
            background: transparent;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            font-weight: 600;
            padding: 1rem 1.25rem;
        }
        [data-bs-theme="dark"] .card-header {
            border-bottom-color: rgba(255,255,255,0.06);
        }
        .btn {
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .btn-primary {
            background: var(--primary-gradient);
            border: none;
        }
        .btn-primary:hover {
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-success {
            background: var(--success-gradient);
            border: none;
        }
        .btn-success:hover {
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            color: white;
            border: none;
            padding: 0.875rem 1rem;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table tbody td {
            padding: 0.75rem 1rem;
            vertical-align: middle;
            border-color: rgba(0,0,0,0.04);
        }
        [data-bs-theme="dark"] .table tbody td {
            border-color: rgba(255,255,255,0.04);
        }
        .movie-row {
            transition: all 0.2s ease;
        }
        .movie-row:hover {
            background-color: rgba(102, 126, 234, 0.04) !important;
        }
        .copy-btn {
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .copy-btn:hover {
            color: #667eea !important;
        }
        .empty-magnet {
            color: #e53e3e;
            font-style: italic;
        }
        .magnet-input {
            font-size: 0.8rem;
            padding: 0.15rem 0.4rem;
            min-width: 0;
        }
        .magnet-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.15rem rgba(102, 126, 234, 0.25);
        }
        .badge-page {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.35em 0.65em;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .theme-toggle {
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
        }
        .theme-toggle:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(15deg);
        }
        .pagination .page-link {
            border-radius: 8px;
            margin: 0 2px;
            border: none;
            color: #667eea;
            font-weight: 500;
        }
        .pagination .page-item.active .page-link {
            background: var(--primary-gradient);
            color: white;
        }
        .pagination .page-link:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }
        .modal-content {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal-header {
            border-bottom: 1px solid rgba(0,0,0,0.06);
            padding: 1.25rem 1.5rem;
        }
        .modal-body {
            padding: 1.5rem;
        }
        .modal-footer {
            border-top: 1px solid rgba(0,0,0,0.06);
            padding: 1rem 1.5rem;
        }
        .toast {
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        footer {
            color: #a0aec0;
            font-size: 0.85rem;
        }
        .search-box .form-control {
            border-radius: 20px 0 0 20px;
            padding-left: 1rem;
        }
        .search-box .btn {
            border-radius: 0 20px 20px 0;
        }
        .action-btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
            border-radius: 6px;
        }
        .btn-settings {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 8px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .btn-settings:hover {
            background: rgba(255,255,255,0.3);
            color: white;
            transform: translateY(-1px);
        }
        .drag-handle {
            user-select: none;
            color: #a0aec0;
            transition: color 0.2s;
        }
        .drag-handle:hover {
            color: #667eea;
        }
        .sortable-drag { opacity: 0; }
        .sortable-fallback { opacity: 0.9; box-shadow: var(--card-hover-shadow); }
        .sortable-chosen { background-color: rgba(102, 126, 234, 0.05) !important; }

        /* 移动端响应式 */
        @media (max-width: 768px) {
            .navbar .container {
                flex-wrap: wrap;
            }
            .navbar-brand {
                font-size: 1rem;
            }
            .navbar .d-flex {
                flex-wrap: wrap;
                gap: 0.25rem !important;
                width: 100%;
                justify-content: flex-end;
            }
            .btn-settings {
                padding: 0.25rem 0.5rem;
                font-size: 0.75rem;
            }
            .btn-settings .me-1 {
                display: none;
            }
            .theme-toggle {
                width: 32px;
                height: 32px;
            }
            .table-responsive {
                font-size: 0.85rem;
            }
            .action-btn {
                padding: 0.2rem 0.4rem;
                font-size: 0.75rem;
            }
            .modal-dialog {
                margin: 0.5rem;
            }
            .modal-body {
                padding: 1rem;
            }
            .card-header {
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
            }
            .card-body {
                padding: 1rem;
            }
            .pagination {
                flex-wrap: wrap;
            }
            .pagination .page-link {
                padding: 0.375rem 0.5rem;
                font-size: 0.85rem;
            }
        }
        @media (max-width: 576px) {
            .navbar .d-flex {
                gap: 0.15rem !important;
            }
            .btn-settings {
                padding: 0.2rem 0.4rem;
                font-size: 0.7rem;
            }
        }

        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>
    
    <nav class="navbar navbar-custom mb-4">
        <div class="container">
            <span class="navbar-brand text-white fw-bold mb-0">
                <i class="bi bi-film me-2"></i>115Transfer
            </span>
            <div class="d-flex gap-2">
                <a href="/" class="btn btn-settings" title="首页">
                    <i class="bi bi-house me-1"></i>首页
                </a>
                <a href="/media" class="btn btn-settings" title="网盘整理">
                    <i class="bi bi-folder-symlink me-1"></i>整理
                </a>
                <a href="/douban" class="btn btn-settings" title="豆瓣同步">
                    <i class="bi bi-film me-1"></i>豆瓣
                </a>
                <a href="/baidu" class="btn btn-settings" title="电影搜索">
                    <i class="bi bi-search me-1"></i>搜索
                </a>
                <a href="/logs" class="btn btn-settings" title="日志查看">
                    <i class="bi bi-journal-text me-1"></i>日志
                </a>
                <button onclick="open115Settings()" class="btn btn-settings" title="115网盘设置">
                    <i class="bi bi-cloud me-1"></i>115设置
                </button>
                <button onclick="openWechatSettings()" class="btn btn-settings" title="企业微信设置">
                    <i class="bi bi-chat-dots me-1"></i>企业微信
                </button>
                <button id="themeToggle" class="theme-toggle" title="切换主题">
                    <i class="bi bi-moon"></i>
                </button>

    <div class="container pb-5">
        {% block content %}{% endblock %}
        
        <footer class="mt-5 text-center">
            <p><i class="bi bi-tag me-1"></i>版本: {{ version }}</p>
        </footer>

    <!-- 编辑模态框 -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>编辑电影</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">页码</label>
                            <input type="number" id="editPage" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">电影名</label>
                            <input type="text" id="editName" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">磁力链接</label>
                            <input type="text" id="editMagnet" class="form-control">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="updateMovie()">
                        <i class="bi bi-check-lg me-1"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 115设置模态框 -->
    <div class="modal fade" id="settings115Modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-cloud me-2"></i>115网盘设置</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">115 Cookie</label>

                        <div class="form-text">请从浏览器开发者工具中获取115.com的Cookie</div>
                    </div>
                    <div id="cookie115Status" class="mb-3"></div>

                        <label class="form-label"><i class="bi bi-folder2 me-1"></i>转存目录</label>
                        <div class="mb-2">
                            <span class="text-muted small">已设置: </span>
                            <span id="savedDirPath" class="text-primary fw-bold">-</span>
                        </div>
                        <div class="mb-2">
                            <span class="text-muted small">当前浏览: </span>
                            <span id="currentDirPath" class="fw-bold">根目录</span>
                            <input type="hidden" id="currentDirId" value="0">
                        </div>
                        <div id="dirList" style="max-height: 250px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 8px; padding: 0.5rem;">
                            <p class="text-muted text-center mb-0">加载中...</p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer justify-content-between">
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="navigateToParent()">
                            <i class="bi bi-arrow-left me-1"></i>返回上级
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="setAsDefaultDir()">
                            <i class="bi bi-check-lg me-1"></i>设为默认
                        </button>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-secondary" onclick="verify115Cookie()">
                            <i class="bi bi-check-circle me-1"></i>验证Cookie
                        </button>
                        <button type="button" class="btn btn-primary" onclick="save115Cookie()">
                            <i class="bi bi-save me-1"></i>保存Cookie

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 115任务列表模态框 -->
    <div class="modal fade" id="tasks115Modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-list-task me-2"></i>115离线任务列表</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

                <div class="modal-body" id="tasks115Body">
                    <p class="text-muted text-center">加载中...</p>

            </div>
        </div>
    </div>

    <!-- 企业微信设置模态框 -->

        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-chat-dots me-2"></i>企业微信设置</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">企业ID (corpid)</label>
                        <input type="text" id="wechatCorpid" class="form-control" placeholder="在企业微信管理后台查看">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">应用Secret (corpsecret)</label>
                        <input type="password" id="wechatCorpsecret" class="form-control" placeholder="在应用管理页面查看">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">应用AgentId</label>
                        <input type="text" id="wechatAgentid" class="form-control" placeholder="在应用管理页面查看">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Token</label>
                        <input type="text" id="wechatToken" class="form-control" placeholder="在应用接收消息设置中获取">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">EncodingAESKey</label>
                        <input type="text" id="wechatEncodingAesKey" class="form-control" placeholder="在应用接收消息设置中获取">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">回调URL（直接对接）</label>
                        <div class="input-group">

                            <button class="btn btn-outline-secondary" onclick="copyWechatCallbackUrl()">

                        <div class="input-group">
                            <input type="text" id="wechatProxyUrl" class="form-control">
                            <button class="btn btn-outline-secondary" onclick="copyWechatProxyUrl()">

                            </button>

                        <div class="d-flex gap-2">

                                <i class="bi bi-menu-button-wide me-1"></i>创建菜单

                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="saveWechatConfig()">
                        <i class="bi bi-save me-1"></i>保存

                </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
    <script>
        // CSRF Token 工具：所有 fetch 请求自动带上
        const CSRF_TOKEN = '{{ csrf_token() }}';

        // 统一的 fetch 封装：自动注入 CSRF token 和 JSON 错误处理
        async function apiFetch(url, options = {}) {
            const method = (options.method || 'GET').toUpperCase();
            const isForm = method !== 'GET' && method !== 'HEAD';

            const headers = options.headers || {};
            headers['Accept'] = 'application/json';
            if (isForm) {
                headers['X-CSRFToken'] = CSRF_TOKEN;
                if (!headers['Content-Type'] && typeof options.body === 'string') {
                    headers['Content-Type'] = 'application/x-www-form-urlencoded';
                }
            }
            options.headers = headers;
            options.credentials = 'same-origin';

            const resp = await fetch(url, options);
            // 401 未登录：跳转登录页
            if (resp.status === 401) {
                window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
                throw new Error('未登录');
            }
            // 403/4xx/5xx 错误：统一处理
            if (resp.status >= 400) {
                const text = await resp.text();
                if (text.startsWith('<')) {
                    throw new Error('服务器错误(' + resp.status + ')，请查看日志');
                }
                let msg = '请求失败(' + resp.status + ')';
                try {
                    const result = JSON.parse(text);
                    if (result.message) msg = result.message;
                } catch (e) {}
                throw new Error(msg);
            }
            return resp;
        }

        async function doLogout() {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/logout';
            const csrf = document.createElement('input');
            csrf.type = 'hidden';
            csrf.name = 'csrf_token';
            csrf.value = CSRF_TOKEN;
            form.appendChild(csrf);
            document.body.appendChild(form);
            form.submit();
        }

        function showToast(message, type = 'success') {
            const icons = { success: 'check-circle-fill', danger: 'exclamation-triangle-fill', info: 'info-circle-fill', warning: 'exclamation-triangle-fill' };
            const bgClass = { success: 'bg-success', danger: 'bg-danger', info: 'bg-info', warning: 'bg-warning' };
            const toastEl = document.createElement('div');
            toastEl.className = `toast align-items-center text-white ${bgClass[type] || 'bg-info'} border-0`;
            toastEl.setAttribute('role', 'alert');
            toastEl.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body"><i class="bi bi-${icons[type] || 'info-circle-fill'} me-2"></i>${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            document.getElementById('toastContainer').appendChild(toastEl);
            const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
            toast.show();
            toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
        }

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-bs-theme', savedTheme);
        updateThemeIcon(savedTheme);
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });
        
        function updateThemeIcon(theme) {
            themeToggle.innerHTML = theme === 'light' ? '<i class="bi bi-moon"></i>' : '<i class="bi bi-sun"></i>';
        }

        async function deleteMovie(id, page) {
            if (confirm('确定要删除这部电影吗？')) {
                showLoading();
                try {
                    const url = page ? `/delete/${id}?page=${page}` : `/delete/${id}`;
                    const response = await apiFetch(url, { method: 'POST' });
                    const result = await response.json();
                    showToast(result.message, result.success ? 'success' : 'danger');
                    if (result.success) {
                        location.reload();
                    }
                } catch (e) {
                    showToast(e.message, 'danger');
                } finally {
                    hideLoading();
                }
            }
        }

        function showEditModal(id, page, name, magnet) {
            document.getElementById('editId').value = id;
            document.getElementById('editPage').value = page;
            document.getElementById('editName').value = name;
            document.getElementById('editMagnet').value = magnet;
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        const tbodyEl = document.querySelector('tbody');
        if (tbodyEl) {
            tbodyEl.addEventListener('click', (e) => {
                const btn = e.target.closest('.edit-btn');
                if (btn) {
                    const { id, page, name, magnet } = btn.dataset;
                    showEditModal(id, page, name, magnet);
                }
            });
        }

        async function updateMovie() {
            const id = document.getElementById('editId').value;
            const page = document.getElementById('editPage').value;
            const name = document.getElementById('editName').value;
            const magnet = document.getElementById('editMagnet').value;

            showLoading();
            try {
                const response = await apiFetch(`/update/${id}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `page=${page}&name=${encodeURIComponent(name)}&magnet=${encodeURIComponent(magnet)}`
                });
                const result = await response.json();
                showToast(result.message, result.success ? 'success' : 'danger');
                if (result.success) {
                    location.reload();
                }
            } catch (e) {
                showToast(e.message, 'danger');
            } finally {
                hideLoading();
            }
        }

        async function copyMagnet(id, page) {
            showLoading();
            try {
                const response = await apiFetch(`/copy_magnet/${id}/${page}`);
                const result = await response.json();
                if (result.success) {
                    copyToClipboard(result.magnet);
                } else {
                    showToast('磁力链接为空，无法复制', 'danger');
                }
            } catch (e) {
                showToast(e.message, 'danger');
            } finally {
                hideLoading();
            }
        }
        
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('已复制到剪贴板');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }
        
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast('已复制到剪贴板');
            } catch (err) {
                showToast('复制失败，请手动复制', 'danger');
            }
            
            document.body.removeChild(textarea);
        }

        async function open115Settings() {
            document.getElementById('cookie115Status').innerHTML = '';
            try {
                const resp = await apiFetch('/cloud115/config');
                const result = await resp.json();
                if (result.has_cookie) {
                    document.getElementById('cookie115Status').innerHTML = `<span class="text-success"><i class="bi bi-check-circle me-1"></i>当前Cookie: ${result.cookie_masked}</span>`;
                } else {
                    document.getElementById('cookie115Status').innerHTML = '<span class="text-warning"><i class="bi bi-exclamation-circle me-1"></i>未配置Cookie</span>';
                }
            } catch (e) {}
            try {
                const pathResp = await apiFetch('/cloud115/save_path');
                const pathResult = await pathResp.json();
                document.getElementById('savedDirPath').textContent = pathResult.path_name || '根目录';
            } catch (e) {
                document.getElementById('savedDirPath').textContent = '根目录';
            }
            currentDirId = '0';
            dirPathStack = [{id: '0', name: '根目录'}];
            document.getElementById('currentDirId').value = '0';
            await loadDirs('0');
            new bootstrap.Modal(document.getElementById('settings115Modal')).show();
        }

        async function save115Cookie() {
            const cookie = document.getElementById('cookie115').value.trim();
            if (!cookie) {
                showToast('请输入Cookie', 'danger');
                return;
            }
            showLoading();
            try {
                const resp = await apiFetch('/cloud115/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `cookie=${encodeURIComponent(cookie)}`
                });
                const result = await resp.json();
                showToast(result.message, result.success ? 'success' : 'danger');
                if (result.success) {
                    bootstrap.Modal.getInstance(document.getElementById('settings115Modal')).hide();
                }
            } catch (e) {
                showToast('保存失败', 'danger');
            }
            hideLoading();
        }

        async function verify115Cookie() {
            const statusEl = document.getElementById('cookie115Status');
            statusEl.innerHTML = '<span class="text-info"><i class="bi bi-arrow-repeat me-1"></i>验证中...</span>';
            try {
                const resp = await apiFetch('/cloud115/verify', { method: 'POST' });
                const result = await resp.json();
                if (result.success) {
                    statusEl.innerHTML = `<span class="text-success"><i class="bi bi-check-circle me-1"></i>${result.message}</span>`;
                } else {
                    statusEl.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle me-1"></i>${result.message}</span>`;
                }
            } catch (e) {
                statusEl.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle me-1"></i>验证请求失败</span>';
            }
        }

        async function openWechatSettings() {
            try {
                const resp = await apiFetch('/wechat/config');
                const result = await resp.json();
                if (result.corpid) document.getElementById('wechatCorpid').value = result.corpid;
                if (result.agentid) document.getElementById('wechatAgentid').value = result.agentid;
                if (result.token) document.getElementById('wechatToken').value = result.token;
                if (result.encoding_aes_key) document.getElementById('wechatEncodingAesKey').value = result.encoding_aes_key;
                const callbackUrl = result.callback_url || (window.location.origin + '/wechat/callback');
                document.getElementById('wechatCallbackUrl').value = callbackUrl;
                const proxyUrl = result.proxy_url || (window.location.origin + '/wechat/proxy');
                document.getElementById('wechatProxyUrl').value = proxyUrl;
                document.getElementById('wechatStatus').innerHTML = result.configured ?
                    '<span class="text-success"><i class="bi bi-check-circle me-1"></i>已配置</span>' :
                    '<span class="text-warning"><i class="bi bi-exclamation-circle me-1"></i>未配置</span>';
            } catch (e) {}
            new bootstrap.Modal(document.getElementById('wechatSettingsModal')).show();
        }

        async function saveWechatConfig() {
            const corpid = document.getElementById('wechatCorpid').value.trim();
            const corpsecret = document.getElementById('wechatCorpsecret').value.trim();
            const agentid = document.getElementById('wechatAgentid').value.trim();
            const token = document.getElementById('wechatToken').value.trim();
            const encoding_aes_key = document.getElementById('wechatEncodingAesKey').value.trim();
            const callback_url = document.getElementById('wechatCallbackUrl').value.trim();
            const proxy_url = document.getElementById('wechatProxyUrl').value.trim();
            if (!corpid || !corpsecret) {
                showToast('企业ID和应用Secret不能为空', 'danger');
                return;
            }
            showLoading();
            try {
                const resp = await apiFetch('/wechat/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `corpid=${encodeURIComponent(corpid)}&corpsecret=${encodeURIComponent(corpsecret)}&agentid=${encodeURIComponent(agentid)}&token=${encodeURIComponent(token)}&encoding_aes_key=${encodeURIComponent(encoding_aes_key)}&callback_url=${encodeURIComponent(callback_url)}&proxy_url=${encodeURIComponent(proxy_url)}`
                });
                const result = await resp.json();
                showToast(result.message, result.success ? 'success' : 'danger');
                if (result.success) {
                    bootstrap.Modal.getInstance(document.getElementById('wechatSettingsModal')).hide();
                }
            } catch (e) {
                showToast('保存失败', 'danger');
            }
            hideLoading();
        }

        function copyWechatCallbackUrl() {
            const url = document.getElementById('wechatCallbackUrl').value;
            copyToClipboard(url);
        }

        function copyWechatProxyUrl() {
            const url = document.getElementById('wechatProxyUrl').value;
            copyToClipboard(url);
        }

        async function createWechatMenu() {
            const statusEl = document.getElementById('wechatMenuStatus');
            statusEl.innerHTML = '<span class="text-info"><i class="bi bi-arrow-repeat me-1"></i>创建中...</span>';
            try {
                const resp = await apiFetch('/wechat/menu', { method: 'POST' });
                const result = await resp.json();
                if (result.success) {
                    statusEl.innerHTML = '<span class="text-success"><i class="bi bi-check-circle me-1"></i>创建成功</span>';
                } else {
                    statusEl.innerHTML = `<span class="text-danger"><i class="bi bi-x-circle me-1"></i>${result.message}</span>`;
                }
            } catch (e) {
                statusEl.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle me-1"></i>请求失败</span>';
            }
        }

        let currentDirId = '0';
        let dirPathStack = [{id: '0', name: '根目录'}];

        function openDirSelector() {
            open115Settings();
        }

        async function loadDirs(cid) {
            const dirListEl = document.getElementById('dirList');
            dirListEl.innerHTML = '<p class="text-muted text-center"><i class="bi bi-arrow-repeat me-1"></i>加载中...</p>';

            try {
                const resp = await apiFetch(`/cloud115/dirs?cid=${cid}`);
                const result = await resp.json();
                
                if (result.success && result.dirs.length > 0) {
                    let html = '<div class="list-group">';
                    result.dirs.forEach(dir => {
                        html += `<button type="button" class="list-group-item list-group-item-action rounded-2 mb-1" onclick="navigateToDir('${dir.cid}', '${dir.name}')">
                            <i class="bi bi-folder2 me-2 text-warning"></i>${dir.name}
                        </button>`;
                    });
                    html += '</div>';
                    dirListEl.innerHTML = html;
                } else {
                    dirListEl.innerHTML = '<p class="text-muted text-center"><i class="bi bi-folder2-open me-1"></i>此目录为空</p>';
                }
            } catch (e) {
                dirListEl.innerHTML = '<p class="text-danger text-center"><i class="bi bi-x-circle me-1"></i>加载失败</p>';
            }
        }

        async function navigateToDir(cid, name) {
            currentDirId = cid;
            dirPathStack.push({id: cid, name: name});
            document.getElementById('currentDirId').value = cid;
            document.getElementById('currentDirPath').textContent = dirPathStack.map(d => d.name).join(' / ');
            await loadDirs(cid);
        }

        async function navigateToParent() {
            if (dirPathStack.length > 1) {
                dirPathStack.pop();
                const parent = dirPathStack[dirPathStack.length - 1];
                currentDirId = parent.id;
                document.getElementById('currentDirId').value = parent.id;
                document.getElementById('currentDirPath').textContent = dirPathStack.map(d => d.name).join(' / ');
                await loadDirs(parent.id);
            }
        }

        async function setAsDefaultDir() {
            showLoading();
            try {
                const pathName = dirPathStack.map(d => d.name).join('/');
                const resp = await apiFetch('/cloud115/save_path', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `path_id=${currentDirId}&path_name=${encodeURIComponent(pathName)}`
                });
                const result = await resp.json();
                showToast(result.message, result.success ? 'success' : 'danger');
                if (result.success) {
                    document.getElementById('savedDirPath').textContent = pathName;
                }
            } catch (e) {
                showToast('设置失败', 'danger');
            }
            hideLoading();
        }

        {% block extra_script %}{% endblock %}
    </script>
</body>
</html>
